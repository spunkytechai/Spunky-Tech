name: Dayflow Android checks

on:
  pull_request:
    paths:
      - "apps/dayflow/**"
      - ".github/workflows/dayflow-check.yml"
  push:
    branches:
      - main
      - "feat/dayflow-production-mvp"
    paths:
      - "apps/dayflow/**"
      - ".github/workflows/dayflow-check.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dayflow
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/dayflow/package.json
      - name: Install dependencies
        run: npm install
      - name: Check Expo dependency compatibility
        run: npx expo install --check
      - name: Inspect Expo project configuration
        run: npx expo-doctor
      - name: Type-check
        run: npm run typecheck
      - name: Lint
        run: npx expo lint
      - name: Unit tests
        run: npm test
      - name: Export Android bundle
        run: npx expo export --platform android
