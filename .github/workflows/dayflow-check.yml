name: Dayflow Android checks

concurrency:
  group: dayflow-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "apps/dayflow/**"
      - ".github/workflows/dayflow-check.yml"
  push:
    branches:
      - main
      - "feat/dayflow-production-mvp"
    paths:
      - "apps/dayflow/**"
      - ".github/workflows/dayflow-check.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dayflow
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/dayflow/package.json
      - name: Install dependencies
        run: npm install
      - name: Check Expo dependency compatibility
        run: npx expo install --check
      - name: Inspect Expo project configuration
        run: npx expo-doctor
      - name: Type-check
        run: npm run typecheck
      - name: Lint
        run: npx expo lint
      - name: Unit tests
        run: npm test
      - name: Export Android bundle
        run: npx expo export --platform android


  android-debug-apk:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dayflow
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm install
      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive
      - name: Build debug APK
        working-directory: apps/dayflow/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dayflow-android-debug-apk
          path: apps/dayflow/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
