name: Dayflow Android checks

concurrency:
  group: dayflow-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "apps/dayflow/**"
      - ".github/workflows/dayflow-check.yml"
  push:
    branches:
      - main
      - "feat/dayflow-production-mvp"
    paths:
      - "apps/dayflow/**"
      - ".github/workflows/dayflow-check.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/dayflow
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/dayflow/package.json
      - name: Install dependencies
        run: npm install
      - name: Check Expo dependency compatibility
        run: npx expo install --check
      - name: Inspect Expo project configuration
        run: npx expo-doctor
      - name: Type-check
        run: npm run typecheck
      - name: Lint
        run: npx expo lint
      - name: Unit tests
        run: npm test
      - name: Export Android bundle
        run: npx expo export --platform android

  android-debug-apk:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/dayflow
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Cache Gradle dependencies
        uses: gradle/actions/setup-gradle@v4
      - name: Install dependencies
        run: npm install
      - name: Generate native Android project
        run: CI=1 npx expo prebuild --platform android
      - name: Verify legacy storage permissions are blocked
        run: |
          manifest="android/app/src/main/AndroidManifest.xml"
          if grep -E 'android\.permission\.(READ|WRITE)_EXTERNAL_STORAGE' "$manifest" | grep -v 'tools:node="remove"'; then
            echo "A legacy external storage permission is still declared without a removal directive."
            exit 1
          fi
          echo "Legacy external storage permissions are configured for removal by the manifest merger."
      - name: Enable JavaScript bundling in the debug variant
        run: |
          build_file="android/app/build.gradle"
          test -f "$build_file"
          python - <<'PY'
          from pathlib import Path
          path = Path("android/app/build.gradle")
          source = path.read_text()
          old = 'debuggableVariants = ["debug"]'
          if old not in source:
              raise SystemExit("Expected React Native debuggableVariants setting was not found; inspect the generated Gradle file before building.")
          path.write_text(source.replace(old, 'debuggableVariants = []', 1))
          print("Debug variant configured to bundle JavaScript instead of requiring Metro.")
          PY
          grep -n 'debuggableVariants = \[\]' "$build_file"
      - name: Build standalone arm64 debug APK with embedded JavaScript
        working-directory: apps/dayflow/android
        run: ./gradlew assembleDebug -PreactNativeArchitectures=arm64-v8a --no-daemon --stacktrace --console=plain
      - name: Verify APK bundle and permissions
        working-directory: apps/dayflow
        run: |
          apk="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          ls -lh "$apk"
          unzip -l "$apk" | tee /tmp/dayflow-apk-files.txt
          if ! grep -E 'assets/index\.android\.bundle|assets/index\.android\.bundle\.hbc' /tmp/dayflow-apk-files.txt; then
            echo "Standalone JavaScript bundle is missing from the APK."
            exit 1
          fi
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$aapt"
          "$aapt" dump permissions "$apk" | tee /tmp/dayflow-apk-permissions.txt
          if grep -E 'android\.permission\.(READ|WRITE)_EXTERNAL_STORAGE' /tmp/dayflow-apk-permissions.txt; then
            echo "Final APK requests a legacy external storage permission."
            exit 1
          fi
          echo "Standalone JavaScript bundle and final APK permission audit passed."
      - name: Upload standalone arm64 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dayflow-android-arm64-debug-apk
          path: apps/dayflow/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
